name: Android checks
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['app/**', 'core/**', 'gradle/**', '**/*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml', 'scripts/android-capture-smoke.py']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.event.label.name || 'build' }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Build and verify
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :core:assembleDebugAndroidTest :core:testDebugUnitTest :app:lintDebug :core:lintDebug

  android-device:
    if: github.event.action == 'labeled' && github.event.label.name == 'android-device-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Allow the emulator to access KVM
        run: |
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 240
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app:assembleDebug
            python3 scripts/android-capture-smoke.py app/build/outputs/apk/debug/app-debug.apk build/android-evidence
            ./gradlew --no-daemon :app:connectedDebugAndroidTest :core:connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-device-evidence
          retention-days: 3
          if-no-files-found: ignore
          path: |
            build/android-evidence/*.png
            app/build/outputs/androidTest-results/connected/debug/**/*.xml
            core/build/outputs/androidTest-results/connected/debug/**/*.xml
