name: Android checks
on:
  pull_request:
    paths: ['app/**', 'core/**', 'gradle/**', '**/*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Build and verify
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :core:assembleDebugAndroidTest :core:testDebugUnitTest :app:lintDebug :core:lintDebug
